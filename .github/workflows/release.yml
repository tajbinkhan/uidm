# Builds UIDM's installers for every system and attaches them to a GitHub
# Release. Release files don't count against the repository's storage, and
# UIDM's own update check reads the latest release.
#
# To release: set the version in Cargo.toml, commit, then push a tag that
# matches it:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Started by hand (Actions > Release > Run workflow), it builds the same
# files without publishing them, as artifacts kept for a day.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "The tag ${{ github.ref_name }} does not match version $version in Cargo.toml" }

      - name: Build
        run: cargo build --release --locked

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "could not install Inno Setup" }
          }

      - name: Build the installer
        shell: pwsh
        run: .\installer\build.ps1 -SkipBuild

      - name: Make the portable zip
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $out = "dist\portable\UIDM"
          New-Item -ItemType Directory -Force "$out\target\release" | Out-Null
          Copy-Item target\release\uidm-host.exe, target\release\uidm-daemon.exe, target\release\uidm-gui.exe "$out\target\release"
          Copy-Item -Recurse extension, host "$out"
          Copy-Item install-host.ps1, README.md "$out"
          New-Item -ItemType Directory -Force "$out\installer" | Out-Null
          Copy-Item installer\make-firefox.ps1 "$out\installer"
          Remove-Item -Recurse -Force "$out\extension\test"
          .\installer\make-firefox.ps1 -Out "$out\firefox"
          Compress-Archive -Path $out -DestinationPath "dist\UIDM-$version-windows-portable.zip"
          Remove-Item -Recurse -Force dist\portable

      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: dist/*
          retention-days: 1
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the disk image
        run: installer/macos/package.sh

      - uses: actions/upload-artifact@v5
        with:
          name: macos
          path: dist/*
          retention-days: 1
          if-no-files-found: error

  linux:
    name: Linux
    # The oldest supported Ubuntu, so the programs run on every newer system.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install the build tools and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libssl-dev rpm

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the packages
        run: installer/linux/package.sh

      - uses: actions/upload-artifact@v5
        with:
          name: linux
          path: dist/*
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "UIDM ${{ github.ref_name }}" \
            --generate-notes
