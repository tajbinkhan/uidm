# Builds UIDM for Windows and runs its tests on every push and pull request.
# The three programs (uidm-host, uidm-daemon, uidm-gui) are uploaded as an
# artifact together with the browser extension and the install script, laid
# out the way install-host.ps1 expects.

name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Collect the build
        shell: pwsh
        run: |
          $out = "dist\uidm"
          New-Item -ItemType Directory -Force "$out\target\release" | Out-Null
          Copy-Item target\release\uidm-host.exe, target\release\uidm-daemon.exe, target\release\uidm-gui.exe "$out\target\release"
          Copy-Item -Recurse extension, host "$out"
          Copy-Item install-host.ps1, README.md "$out"
          Remove-Item -Recurse -Force "$out\extension\test"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: uidm-windows
          path: dist/uidm
          if-no-files-found: error
