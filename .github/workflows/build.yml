# Builds UDM and runs its tests on Windows, macOS and Linux for every pull
# request and every push to main. Other branches are built once they have a
# pull request, so a push to a PR branch runs the matrix once, not twice.
# Nothing is stored: the installers are made by release.yml, which attaches
# them to a GitHub Release.

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-15
          - name: Linux
            os: ubuntu-22.04
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install the Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libssl-dev libxkbcommon-x11-0 libayatana-appindicator3-1 libayatana-appindicator3-dev libwebkit2gtk-4.1-dev librsvg2-dev build-essential

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      # AGENTS.md section 13: the shell embeds the built frontend, so it is
      # built before Cargo runs.
      - name: Build the frontend
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend build

      # rustfmt.toml holds the settings. Run cargo fmt before committing.
      - name: Check formatting
        run: cargo fmt --all --check

      - name: Build
        run: cargo build --workspace --locked

      # Each runner checks its own platform's code, so a warning in a
      # Windows-only or Linux-only block fails only there.
      - name: Clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Check the frontend
        run: |
          pnpm --dir frontend check
          pnpm --dir frontend lint
          pnpm --dir frontend test

      - name: Test the extension
        run: node --test extension/test/*.test.js

      # Git keeps extension/firefox, the Firefox copy of extension/chromium,
      # so a change to the Chromium extension must remake it (#149). This
      # checks the kept copy, then makes a fresh one and checks that too,
      # which proves the maker and the check agree.
      - name: Check the Firefox copy
        shell: bash
        run: |
          node installer/make-firefox.js --check
          node installer/make-firefox.js "$RUNNER_TEMP/firefox-node"
          node installer/make-firefox.js --check "$RUNNER_TEMP/firefox-node"

      # The same for extension/safari, the Safari copy.
      - name: Check the Safari copy
        shell: bash
        run: |
          node installer/make-safari.js --check
          node installer/make-safari.js "$RUNNER_TEMP/safari-node"
          node installer/make-safari.js --check "$RUNNER_TEMP/safari-node"

      # The Safari extension's app extension, with its Swift handler, built
      # and signed as package.sh does, into a stand-in UDM.app holding this
      # build's udm-host (macos-15 has Xcode, so its converter must be there).
      - name: Build the Safari extension
        if: runner.os == 'macOS'
        env:
          UDM_SAFARI: require
        run: |
          app="$RUNNER_TEMP/safari-check/UDM.app"
          mkdir -p "$app/Contents/MacOS"
          cp target/debug/udm-host "$app/Contents/MacOS/"
          installer/macos/safari/build.sh "$app" 0.0.0
          codesign --verify --strict --verbose=2 "$app/Contents/PlugIns/UDM Extension.appex"
          codesign -d --entitlements - "$app/Contents/PlugIns/UDM Extension.appex" | grep -q com.apple.security.app-sandbox

      # Setup's build checks the copy with make-firefox.ps1 instead, in
      # PowerShell 7 and Windows PowerShell 5.1: each must make the same copy
      # as make-firefox.js, and its own check must agree.
      - name: Check the Windows Firefox copy (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\installer\windows\make-firefox.ps1 -Check extension\firefox
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\installer\windows\make-firefox.ps1 -Out "$env:RUNNER_TEMP\firefox-pwsh"
          node installer/make-firefox.js --check "$env:RUNNER_TEMP\firefox-pwsh"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\installer\windows\make-firefox.ps1 -Check "$env:RUNNER_TEMP\firefox-pwsh"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\installer\windows\make-firefox.ps1 -Check "$env:RUNNER_TEMP\firefox-node"

      - name: Check the Windows Firefox copy (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\installer\windows\make-firefox.ps1 -Out "$env:RUNNER_TEMP\firefox-powershell"
          node installer/make-firefox.js --check "$env:RUNNER_TEMP\firefox-powershell"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\installer\windows\make-firefox.ps1 -Check "$env:RUNNER_TEMP\firefox-powershell"
