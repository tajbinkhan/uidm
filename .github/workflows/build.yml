# Builds UIDM for Windows and runs its tests on every push and pull request.
# The three programs (uidm-host, uidm-daemon, uidm-gui) are uploaded as an
# artifact together with the browser extension, its Firefox copy and the
# install script, laid out the way install-host.ps1 expects. The installer,
# UIDM-Setup-<version>.exe, is uploaded as a second artifact.

name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the extension
        run: node --test extension/test/*.test.js

      - name: Collect the build
        shell: pwsh
        run: |
          $out = "dist\uidm"
          New-Item -ItemType Directory -Force "$out\target\release" | Out-Null
          Copy-Item target\release\uidm-host.exe, target\release\uidm-daemon.exe, target\release\uidm-gui.exe "$out\target\release"
          Copy-Item -Recurse extension, host "$out"
          Copy-Item install-host.ps1, README.md "$out"
          New-Item -ItemType Directory -Force "$out\installer" | Out-Null
          Copy-Item installer\make-firefox.ps1 "$out\installer"
          Remove-Item -Recurse -Force "$out\extension\test"
          .\installer\make-firefox.ps1 -Out "$out\firefox"

      - name: Upload
        uses: actions/upload-artifact@v5
        with:
          name: uidm-windows
          path: dist/uidm
          if-no-files-found: error

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "could not install Inno Setup" }
          }

      - name: Build the installer
        shell: pwsh
        run: .\installer\build.ps1 -SkipBuild

      - name: Upload the installer
        uses: actions/upload-artifact@v5
        with:
          name: uidm-windows-setup
          path: dist/UIDM-Setup-*.exe
          if-no-files-found: error
