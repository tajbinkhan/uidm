[package]
name = "udm-infrastructure"
description = "UDM's adapters: download engine, protocol, storage, IPC and OS integration"
version.workspace = true
edition.workspace = true
license.workspace = true

# The old `udm` library, moved here unchanged. It still holds domain rules
# next to its I/O; AGENTS.md section 16 tracks what moves out.
[dependencies]
udm-domain.workspace = true
# Only for the ports `udm-application` defines (AGENTS.md section 3): a
# client's daemon connection (`daemon_client`, mapped by `wire`), and
# `udm-cli`'s progress (`tool`, which maps its command line to the
# `remote` use cases' requests), and `udm-mcp`'s tools (`mcp`, which
# maps each tool call to a `remote::Request` for the `Tools` port).
udm-application.workspace = true
serde.workspace = true
serde_json.workspace = true
# OS randomness for the daemon's per-start auth token and handshake nonces.
getrandom = "0.4"
# Resolving redirect locations, which the engine follows itself.
url.workspace = true
# Digest authentication for site logins (MD5 and MD5-sess; SHA-256 uses sha2).
md-5 = "0.10"
# NTLM logins: the NT hash of the password is MD4 (same digest family as md-5).
md4 = "0.10"
# Form bodies of POST downloads travel base64-encoded in JSON.
base64.workspace = true
# HMAC-SHA256 proofs in the host <-> daemon handshake, so neither side ever
# sends the token itself.
hmac = "0.13.0"
sha2 = "0.11.1"
# Checking the minisign signature on a release's SHA256SUMS before Update
# now installs anything (#267). Pure Rust, no dependencies of its own.
minisign-verify = "0.3.0"
# Checking a download against the SHA-1 or CRC32 checksum a site publishes
# (MD5 and SHA-2 use md-5 and sha2). Both were already in the lock file.
sha1 = "0.10"
crc32fast = "1"
# DASH manifests (.mpd) are XML; a small, read-only, pure-Rust parser.
roxmltree = "0.20"
# HLS segments encrypted with AES-128 (CBC with PKCS#7 padding).
aes = "0.8"
cbc = "0.1"
# The site grabber reads pages with html5ever, a browser-grade HTML parser.
scraper = "0.20"
# Decoding %-escapes in file names the site grabber finds (url uses it too).
percent-encoding.workspace = true
# The download engine's HTTP client: HTTP/2 when the server offers it
# (ALPN through native-tls, so SChannel on Windows, which builds without a
# C/assembly toolchain, unlike rustls + ring on windows-gnu), SOCKS proxies,
# and a timeout between reads. Async, run on one small shared tokio runtime; the
# engine keeps its plain threads and blocks on each step. No gzip: a range
# request must come back as the bytes asked for.
reqwest = { version = "0.12", default-features = false, features = ["native-tls-alpn", "http2", "socks"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
# Binding the FTP engine's sockets, and its active-mode listener, to the
# network adapter Options picks (`route`): `bind_device` on Linux, the
# interface index on macOS, the adapter's address on Windows. reqwest and
# tokio already depend on this exact version; `all` only unlocks those
# calls, so no new crate enters the lock file.
socket2 = { version = "0.6", features = ["all"] }
# The computer's network adapters and their addresses, for Options' list
# and the kill switch (`adapters`): getifaddrs on macOS and Linux,
# GetAdaptersAddresses on Windows. Small, with only libc and windows-sys
# (both already in the lock file) under it.
if-addrs = "=0.15.0"
# FTPS: TLS on the FTP engine's blocking control and data connections, through
# the same OS TLS as reqwest (SChannel on Windows, Security.framework on macOS,
# OpenSSL elsewhere). reqwest already pulls in this exact crate for
# `native-tls-alpn`, so no new crate enters the lock file.
native-tls = "0.2"
bytes = "1"
# The traits for the connector layer that keeps an NTLM handshake on one
# connection. reqwest already depends on both.
tower-layer = "0.3"
tower-service = "0.3"
# The user's home, AppData and XDG base folders for the paths module, so no
# other module reads APPDATA, LOCALAPPDATA or XDG_* (AGENTS.md section 6).
# Its dirs-sys is already in the lockfile through another dependency.
directories = "6"
# The engine's log events (AGENTS.md section 11).
tracing.workspace = true
# Each module's error enum (AGENTS.md section 9).
thiserror.workspace = true
# The subscriber `logging` builds for each program's log file. Only the
# plain-text formatter: no ANSI colors, no env filter (regex) and no bridge
# from the `log` crate. `logging` appends to the files itself, so there is no
# tracing-appender.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

# The remote-control page's self-signed certificate, made on this computer
# the first time remote control is turned on (`web_remote::certificate`), and
# the FTPS tests' test server certificate, made when the tests run so no
# private key is committed. rcgen without its ring/aws-lc-rs backends writes
# the certificate; rsa makes the key and signs it in pure Rust (SChannel's
# `Identity::from_pkcs8` takes RSA keys only), so it builds for every target
# without a C toolchain. The TLS itself is native-tls's. All three were
# dev-dependencies already, so no new crate enters Cargo.lock. (rsa's
# RUSTSEC-2023-0071 timing leak concerns decrypting and signing that an
# attacker can time; rsa signs only the certificate, once, here, and the
# handshakes are the system TLS library's.)
rcgen = { version = "0.14", default-features = false, features = ["pem"] }
rsa = { version = "0.9", features = ["sha2", "pem"] }
rand_core = { version = "0.6", features = ["getrandom"] }

# `udm-cli pair`'s QR code in the terminal (`tool::qr_text`): the same
# pure-Rust encoder, with no dependencies, the window draws its code with.
qrcode = { version = "0.14", default-features = false }

# Unpacking a package's archives in-process (`unpack`): zip (deflate,
# deflate64, LZMA and XZ entries, ZipCrypto and AES passwords), tar, and
# gzip and xz streams. All pure Rust, so they build for windows-gnu and
# apple-darwin without a C toolchain: flate2 on its default miniz_oxide
# backend (already in Cargo.lock through png), lzma-rust2 for xz, and zip
# without its bzip2, zstd and ppmd C or extra codecs. 7z and RAR go to an
# installed 7-Zip instead.
zip = { version = "9.5", default-features = false, features = ["deflate-flate2", "deflate64", "aes-crypto", "lzma", "xz"] }
flate2 = "1"
tar = { version = "0.4", default-features = false }
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz"] }

# Torrents and magnet links (`torrent`): librqbit's session, on the
# engine's shared tokio runtime (it starts no runtime of its own). Without
# its default features: no HTTP API, web UI, tracing subscriber or
# Postgres, and no rustls. Apache-2.0. Its SHA-1 comes from the system's
# crypto library (crypto-hash: OpenSSL here, CommonCrypto on macOS,
# CryptoAPI on Windows), which librqbit-core's feature turns on; its HTTP
# trackers use reqwest 0.13 (already in Cargo.lock through tauri) with the
# same OS TLS as the engine (native-tls), which the line after turns on.
librqbit = { version = "=9.1.0", default-features = false }
librqbit-core = { version = "=9.1.0", default-features = false, features = ["sha1-crypto-hash"] }
reqwest-torrent = { package = "reqwest", version = "0.13", default-features = false, features = ["native-tls"] }

# The window's file and folder pickers (IFileOpenDialog on Windows, through
# windows-sys, so it builds on windows-gnu; panels on macOS).
rfd = { version = "0.15.4", default-features = false }

# WinRT toast notifications from the daemon, DPAPI, the registry.
[target.'cfg(windows)'.dependencies]
windows.workspace = true

# The Trash on macOS and Linux (the Recycle Bin is called directly).
[target.'cfg(unix)'.dependencies]
trash = "5"
# The clipboard's text for the window's clipboard monitor (Windows' is read
# directly).
arboard = { version = "3.7.0", default-features = false }
# The local time zone for queue schedules (localtime_r).
libc = "0.2"

# The pickers' GTK backend on Linux.
[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.15.4", default-features = false, features = ["gtk3"] }

# The workspace's lints: no unwrap, expect or panic outside tests.
[lints]
workspace = true

