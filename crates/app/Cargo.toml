[package]
name = "uidm-app"
description = "UIDM's binaries: native-messaging host, persistent daemon and desktop window"
version.workspace = true
edition.workspace = true
license.workspace = true

# The browser launches this; it relays to the daemon (and has a CLI test mode).
[[bin]]
name = "uidm-host"
path = "src/bin/uidm-host.rs"

# Long-lived process that owns the engine so downloads outlive the browser.
[[bin]]
name = "uidm-daemon"
path = "src/bin/uidm-daemon.rs"

# Desktop window that lists and controls downloads; another daemon client.
# Its views are in uidm-ui; this binary wires them to the adapters.
[[bin]]
name = "uidm-gui"
path = "src/bin/uidm-gui.rs"

[dependencies]
uidm-domain.workspace = true
uidm-application.workspace = true
uidm-infrastructure.workspace = true
uidm-ui.workspace = true
serde.workspace = true
serde_json.workspace = true
# The binaries' log events; `uidm_infrastructure::logging` writes them.
tracing.workspace = true
# The window's run result, which `uidm-gui`'s main returns.
eframe = "0.31.1"
