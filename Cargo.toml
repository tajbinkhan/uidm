[workspace]
resolver = "2"
# The layers of AGENTS.md. Dependencies point inward: domain <- application
# <- infrastructure and ui <- app. AGENTS.md section 16 tracks where the code
# still differs from them.
members = ["crates/domain", "crates/application", "crates/infrastructure", "crates/ui", "crates/app"]
# A patched copy of a third-party crate (see [patch.crates-io] below), not
# one of UDM's.
exclude = ["vendor/librqbit-tracker-comms"]

# The release scripts read the first `version = ` line of this file.
[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
udm-domain = { path = "crates/domain" }
udm-application = { path = "crates/application" }
udm-infrastructure = { path = "crates/infrastructure" }
udm-ui = { path = "crates/ui", default-features = false }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
# Each layer's error enum (AGENTS.md section 9). Already in Cargo.lock
# through reqwest, so it adds no new download.
thiserror = "2.0.21"
# The binaries' startup errors, with what was being done (AGENTS.md
# section 9: app only).
anyhow = "1"
# Log events (AGENTS.md section 11), for infrastructure and app only. Just
# the event macros, without #[instrument] and its proc macro. Already in
# Cargo.lock through reqwest.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
url = "2"
base64 = "0.22"
percent-encoding = "2"
windows = { version = "0.61", features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "Win32_System_Com",
    # SHDoDragDrop: dragging a finished file out of the window.
    "Win32_System_Ole",
    # GetTickCount, with GetLastInputInfo below: the time since the last
    # input, for the speed limit that applies only while the computer is in
    # use.
    "Win32_System_SystemInformation",
    "Win32_System_WinRT",
    "Win32_UI_Input_KeyboardAndMouse",
    # SHDoDragDrop and the file's data object, for the drag above.
    "Win32_UI_Shell",
] }

# librqbit's tracker client, with a fix for systems without IPv6 (its
# README.UDM.md says what and why). Torrents (`udm_infrastructure::torrent`).
[patch.crates-io]
librqbit-tracker-comms = { path = "vendor/librqbit-tracker-comms" }

[profile.release]
# Debug info goes, function names stay, so a crash report's backtrace names
# the functions on macOS and Linux (`crash`). Windows keeps them in a PDB,
# which is not shipped.
strip = "debuginfo"

# The remote-control page's certificate and the FTPS tests' test server make
# an RSA key (udm-infrastructure's `web_remote::certificate`); unoptimized,
# finding its primes takes tens of seconds instead of well under one.
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3

# AGENTS.md section 9: no unwrap, expect or panic outside tests. Warnings,
# which the quality gate's `-D warnings` turns into errors. clippy.toml lets
# tests unwrap, expect and panic; a documented invariant takes a local
# `#[allow(clippy::expect_used)]` next to the comment that states it. Each
# crate opts in with `[lints] workspace = true`.
[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
